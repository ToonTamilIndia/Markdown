<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Note — Markdown Notes</title>

    <!-- Only essential libs synchronous -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

    <!-- Heavy libs lazy-loaded only when content needs them -->

    <style>
        :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #252526;
            --bg-tertiary: #2d2d2d;
            --bg-hover: #2a2d2e;
            --bg-input: #3c3c3c;
            --text-primary: #cccccc;
            --text-secondary: #969696;
            --text-muted: #6a6a6a;
            --accent-primary: #0078d4;
            --accent-secondary: #3fb950;
            --accent-danger: #f85149;
            --border-color: #3c3c3c;
            --radius: 6px;
            --radius-sm: 3px;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(121,121,121,.4); }
        ::-webkit-scrollbar-thumb:hover { background: rgba(121,121,121,.7); }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        .view-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 48px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .view-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
        }
        .view-logo:hover { color: var(--accent-primary); }
        .view-logo svg { color: var(--accent-primary); }
        .view-actions { display: flex; gap: 6px; }
        .view-btn {
            padding: 5px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all .15s;
            text-decoration: none;
        }
        .view-btn-primary {
            background: var(--accent-primary);
            color: #fff;
            border: none;
        }
        .view-btn-primary:hover { background: #1a8cdb; }
        .view-btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .view-btn-secondary:hover { background: var(--bg-hover); border-color: var(--accent-primary); }
        .hidden { display: none !important; }

        /* Container */
        .view-container {
            max-width: 860px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .note-header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .note-title { font-size: 1.8rem; font-weight: 600; color: #e0e0e0; margin-bottom: 6px; }
        .note-meta { color: var(--text-muted); font-size: 12px; display: flex; gap: 12px; }
        .view-like-btn {
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            padding: 2px 8px;
            cursor: pointer;
            font: inherit;
        }
        .view-like-btn:hover { border-color: var(--accent-primary); }
        .view-like-btn:disabled { opacity: .7; cursor: default; }

        /* Note Content (mirrors preview-content from main app) */
        .note-content { color: var(--text-primary); line-height: 1.6; font-size: 15px; }

        .note-content h1, .note-content h2, .note-content h3,
        .note-content h4, .note-content h5, .note-content h6 {
            margin: 20px 0 10px; font-weight: 600; color: #e0e0e0; line-height: 1.3;
        }
        .note-content h1 { font-size: 2em; border-bottom: 1px solid var(--border-color); padding-bottom: .3em; }
        .note-content h2 { font-size: 1.5em; border-bottom: 1px solid var(--border-color); padding-bottom: .3em; }
        .note-content h3 { font-size: 1.25em; }

        .note-content p { margin: 0 0 14px; }
        .note-content a { color: #4fc1ff; text-decoration: none; }
        .note-content a:hover { text-decoration: underline; }
        .note-content strong { font-weight: 600; }

        .note-content code {
            background: var(--bg-tertiary);
            padding: .2em .4em;
            border-radius: 3px;
            font-family: 'Cascadia Code', Consolas, monospace;
            font-size: .88em;
        }
        .note-content pre {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            border-radius: var(--radius);
            overflow-x: auto;
            margin: 14px 0;
        }
        .note-content pre code { background: none; padding: 0; font-size: .9em; line-height: 1.5; }

        .note-content blockquote {
            border-left: 3px solid var(--accent-primary);
            padding: 4px 16px;
            margin: 14px 0;
            color: var(--text-secondary);
        }
        .note-content ul, .note-content ol { padding-left: 1.8em; margin: 0 0 14px; }
        .note-content li { margin: 3px 0; }

        .note-content table { width: 100%; border-collapse: collapse; margin: 14px 0; }
        .note-content th, .note-content td { border: 1px solid var(--border-color); padding: 8px 12px; }
        .note-content th { background: var(--bg-tertiary); font-weight: 600; }
        .note-content tr:nth-child(even) { background: rgba(255,255,255,.03); }

        .note-content hr { border: none; border-top: 1px solid var(--border-color); margin: 20px 0; }
        .note-content img { max-width: 100%; border-radius: var(--radius); }

        .note-content .katex-display { margin: 14px 0; overflow-x: auto; }
        .note-content .math-display { text-align: center; margin: 16px 0; overflow-x: auto; padding: 8px 0; }
        .note-content .katex { font-size: 1.1em; }
        .note-content input[type="checkbox"] { margin-right: 6px; accent-color: var(--accent-primary); }
        .note-content .task-list-item { list-style: none; margin-left: -1.5em; }

        .note-content .callout { padding: 12px 16px; border-radius: var(--radius); margin: 14px 0; border-left: 3px solid; }
        .note-content .callout-warning { background: rgba(204,167,0,.08); border-color: #cca700; }
        .note-content .callout-info { background: rgba(0,120,212,.08); border-color: var(--accent-primary); }
        .note-content .callout-success { background: rgba(63,185,80,.08); border-color: var(--accent-secondary); }
        .note-content .callout-danger { background: rgba(248,81,73,.08); border-color: var(--accent-danger); }

        /* Diagrams & Charts */
        .mermaid-container, .diagram-container, .chart-container {
            margin: 14px 0; padding: 12px; background: var(--bg-tertiary); border-radius: var(--radius); overflow-x: auto;
        }
        .mermaid-container { text-align: center; }
        .mermaid-container svg, .diagram-container svg { max-width: 100%; height: auto; }
        .mermaid-container svg, .mermaid svg { display: block; margin: 0 auto; }
        .diagram-image { max-width: 100%; height: auto; display: block; margin: 0 auto; }
        .diagram-error { padding: 10px; margin: 10px 0; background: rgba(248,81,73,.08); border-left: 3px solid var(--accent-danger); color: var(--accent-danger); border-radius: var(--radius); font-size: 12px; }
        .chart-container canvas { max-width: 100%; height: auto !important; }
        .mermaid { background: transparent; text-align: center; }
        .mermaid svg { max-width: 100%; height: auto; }
        .d2-placeholder { background: var(--bg-tertiary); border: 1px solid var(--border-color); }

        /* States */
        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; gap: 12px; }
        .loading-spinner { width: 32px; height: 32px; border: 2px solid var(--border-color); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--text-muted); font-size: 13px; }

        .error-container { text-align: center; padding: 60px 24px; }
        .error-icon { margin-bottom: 12px; }
        .error-title { font-size: 18px; margin-bottom: 8px; color: var(--accent-danger); }
        .error-message { color: var(--text-secondary); margin-bottom: 20px; font-size: 13px; }

        /* Footer */
        .view-footer { text-align: center; padding: 24px; color: var(--text-muted); font-size: 12px; border-top: 1px solid var(--border-color); margin-top: 40px; }
        .view-footer a { color: var(--accent-primary); text-decoration: none; }
        .view-footer a:hover { text-decoration: underline; }

        /* Status Bar */
        .view-status { height: 22px; display: flex; align-items: center; padding: 0 12px; background: var(--accent-primary); color: #fff; font-size: 12px; position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; }

        body.theme-light {
            --bg-primary: #ffffff;
            --bg-secondary: #f3f3f3;
            --bg-tertiary: #e8e8e8;
            --bg-hover: #e4e4e4;
            --bg-input: #ffffff;
            --text-primary: #1e1e1e;
            --text-secondary: #616161;
            --text-muted: #737373;
            --border-color: #d4d4d4;
            --accent-primary: #0078d4;
        }
        body.theme-light .note-title,
        body.theme-light .note-content h1,
        body.theme-light .note-content h2,
        body.theme-light .note-content h3,
        body.theme-light .note-content h4,
        body.theme-light .note-content h5,
        body.theme-light .note-content h6 { color: #1e1e1e; }
        body.theme-light .note-content pre { background: #f8f8f8; }

        body.theme-sepia {
            --bg-primary: #f4ecd8;
            --bg-secondary: #e8dfc8;
            --bg-tertiary: #d9ccb0;
            --bg-hover: #d0c3a8;
            --bg-input: #f4ecd8;
            --text-primary: #4d3a2c;
            --text-secondary: #6f5a47;
            --text-muted: #8a7663;
            --border-color: #c8b99a;
            --accent-primary: #7b5d12;
        }

        body.theme-nord {
            --bg-primary: #2e3440;
            --bg-secondary: #3b4252;
            --bg-tertiary: #434c5e;
            --bg-hover: #4c566a;
            --bg-input: #3b4252;
            --text-primary: #eceff4;
            --text-secondary: #d8dee9;
            --text-muted: #a0a8b7;
            --border-color: #4c566a;
            --accent-primary: #88c0d0;
        }

        /* ── Interactive Code Runner — VS Code style ─────────────── */
        .code-runner-wrap {
            margin: 16px 0;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            overflow: hidden;
            background: #1e1e1e;
            font-family: 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace;
            box-shadow: 0 2px 8px rgba(0,0,0,.35);
        }
        /* Tab bar — mirrors VS Code's editor tab row */
        .code-runner-header {
            display: flex;
            align-items: stretch;
            background: #252526;
            border-bottom: 1px solid #3c3c3c;
            min-height: 35px;
            padding: 0;
            gap: 0;
        }
        .code-runner-tab {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 14px;
            font-size: 12px;
            color: #cccccc;
            border-right: 1px solid #3c3c3c;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            user-select: none;
        }
        .code-runner-tab.active {
            border-bottom-color: #007acc;
            background: #1e1e1e;
            color: #ffffff;
        }
        .code-runner-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .code-runner-spacer { flex: 1; }
        .code-runner-actions {
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 4px;
        }
        /* Run button — VS Code green play */
        .code-run-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 11px;
            border: none;
            border-radius: 3px;
            background: #388a34;
            color: #ffffff;
            font-size: 12px;
            font-weight: 500;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: pointer;
            transition: background .12s;
            white-space: nowrap;
        }
        .code-run-btn:hover:not(:disabled) { background: #4caf4c; }
        .code-run-btn:active:not(:disabled) { background: #2d6e2a; }
        .code-run-btn:disabled { opacity: .45; cursor: not-allowed; }
        .code-run-btn.running { background: #007acc; }
        @keyframes pulse-btn { 0%,100%{opacity:1} 50%{opacity:.6} }
        @keyframes spin-btn  { to { transform: rotate(360deg); } }
        /* Editor textarea — VS Code editor area */
        .code-runner-editor {
            display: block;
            width: 100%;
            min-height: 72px;
            max-height: 420px;
            resize: vertical;
            padding: 10px 16px 10px 48px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            border-bottom: 1px solid #3c3c3c;
            border-left: 4px solid #252526;
            outline: none;
            font-family: 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace;
            font-size: 13.5px;
            line-height: 1.6;
            tab-size: 4;
            white-space: pre;
            overflow-x: auto;
            caret-color: #aeafad;
            transition: border-left-color .15s;
        }
        .code-runner-editor:focus { border-left-color: #007acc; outline: none; }
        .code-runner-editor::selection { background: #264f78; }
        /* stdin row */
        .code-runner-stdin-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 10px;
            background: #252526;
            border-bottom: 1px solid #3c3c3c;
        }
        .code-runner-stdin-label {
            font-size: 10.5px;
            color: #858585;
            white-space: nowrap;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            text-transform: uppercase;
            letter-spacing: .06em;
        }
        .code-runner-stdin {
            flex: 1;
            padding: 3px 8px;
            background: #3c3c3c;
            border: 1px solid transparent;
            border-radius: 2px;
            color: #d4d4d4;
            font-family: 'Cascadia Code', Consolas, monospace;
            font-size: 12px;
            outline: none;
            transition: border-color .12s;
        }
        .code-runner-stdin:focus { border-color: #007acc; }
        .code-runner-stdin::placeholder { color: #555; }
        /* Output — VS Code terminal panel */
        .code-run-output {
            font-family: 'Cascadia Code', Consolas, 'Courier New', monospace;
            font-size: 12.5px;
            line-height: 1.55;
            background: #0c0c0c;
            border-top: 1px solid #3c3c3c;
        }
        .code-run-output-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            letter-spacing: .02em;
            border-bottom: 1px solid #1a1a1a;
        }
        .code-run-output.running .code-run-output-header { color: #75beff; background: #0c2c47; }
        .code-run-output.success .code-run-output-header { color: #89d185; background: #0d2b0f; }
        .code-run-output.error   .code-run-output-header { color: #f14c4c; background: #290000; }
        .code-run-output pre {
            margin: 0;
            padding: 10px 16px 14px;
            background: transparent;
            border: none;
            white-space: pre-wrap;
            word-break: break-word;
            color: #cccccc;
            font-size: 12.5px;
        }
        .code-run-meta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #858585;
            font-weight: normal;
        }
        .code-run-meta svg { opacity: .65; vertical-align: -2px; }

        /* Print */
        @media print {
            .view-header, .view-status { display: none !important; }
            body { background: #fff !important; color: #000 !important; }
            .note-content { max-width: 100% !important; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .view-container { padding: 20px 16px; }
            .note-title { font-size: 1.4rem; }
            .view-header { padding: 0 12px; }
        }
    </style>
</head>
<body>
    <header class="view-header">
        <a href="/" class="view-logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Markdown Notes
        </a>
        <div class="view-actions">
            <button class="view-btn view-btn-secondary hidden" id="rawViewBtn" onclick="openRawView()">Raw</button>
            <button class="view-btn view-btn-secondary" onclick="copyContent()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                Copy
            </button>
            <a href="/" class="view-btn view-btn-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                Create Note
            </a>
        </div>
    </header>

    <div class="view-container">
        <main id="main-content">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p class="loading-text">Loading shared note...</p>
            </div>
        </main>

        <footer class="view-footer">
            Powered by <a href="/">Markdown Notes</a> · <a href="https://markdown.toontamilindia.in">markdown.toontamilindia.in</a>
        </footer>
    </div>

    <div class="view-status">
        <span id="viewStatusText">Shared Note</span>
    </div>

    <script>
    (function applySavedTheme() {
        try {
            var settings = JSON.parse(localStorage.getItem('markdown_notes_settings') || '{}');
            if (settings.theme && settings.theme !== 'dark') {
                document.body.classList.add('theme-' + settings.theme);
            }
        } catch(e) {}
    })();

    // ==================== Lazy Script Loader ====================
    const _loaded = {};
    function loadScript(url) {
        if (_loaded[url]) return _loaded[url];
        _loaded[url] = new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = url; s.onload = resolve; s.onerror = reject;
            document.head.appendChild(s);
        });
        return _loaded[url];
    }

    async function ensureMermaid() {
        if (typeof mermaid !== 'undefined') return;
        await loadScript('https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js');
        mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose', flowchart: { useMaxWidth: true } });
    }
    async function ensureChartJS() { if (typeof Chart !== 'undefined') return; await loadScript('https://cdn.jsdelivr.net/npm/chart.js'); }
    async function ensurePlotly() { if (typeof Plotly !== 'undefined') return; await loadScript('https://cdn.plot.ly/plotly-2.27.0.min.js'); }
    async function ensureVega() {
        if (typeof vegaEmbed !== 'undefined') return;
        await loadScript('https://cdn.jsdelivr.net/npm/vega@5');
        await loadScript('https://cdn.jsdelivr.net/npm/vega-lite@5');
        await loadScript('https://cdn.jsdelivr.net/npm/vega-embed@6');
    }
    async function ensureViz() {
        if (typeof Viz !== 'undefined') return;
        await loadScript('https://unpkg.com/viz.js@2.1.2/viz.js');
        await loadScript('https://unpkg.com/viz.js@2.1.2/full.render.js');
    }
    async function ensurePlantUML() {
        if (typeof plantumlEncoder !== 'undefined') return;
        await loadScript('https://cdn.jsdelivr.net/npm/plantuml-encoder@1.4.0/dist/plantuml-encoder.min.js');
    }

    // ==================== Marked Config ====================
    marked.setOptions({
        gfm: true, breaks: true,
        highlight: function(code, lang) {
            if (lang && hljs.getLanguage(lang)) { try { return hljs.highlight(code, { language: lang }).value; } catch(e){} }
            return hljs.highlightAuto(code).value;
        }
    });

    // ==================== Math ====================
    let mathPlaceholders = [];

    function preprocessMath(content) {
        mathPlaceholders = [];
        let n = 0;
        content = content.replace(/\$\$([\s\S]*?)\$\$/g, function(m, math) { var p = '%%MD' + n + '%%'; mathPlaceholders.push({ p: p, math: math.trim(), d: true }); n++; return p; });
        content = content.replace(/\$([^\$\n]+?)\$/g, function(m, math) { var p = '%%MD' + n + '%%'; mathPlaceholders.push({ p: p, math: math.trim(), d: false }); n++; return p; });
        content = content.replace(/\\\[([\s\S]*?)\\\]/g, function(m, math) { var p = '%%MD' + n + '%%'; mathPlaceholders.push({ p: p, math: math.trim(), d: true }); n++; return p; });
        content = content.replace(/\\\(([\s\S]*?)\\\)/g, function(m, math) { var p = '%%MD' + n + '%%'; mathPlaceholders.push({ p: p, math: math.trim(), d: false }); n++; return p; });
        return content;
    }

    function postprocessMath(html) {
        mathPlaceholders.forEach(function(item) {
            try {
                var rendered = katex.renderToString(item.math, {
                    displayMode: item.d, throwOnError: false, trust: true, strict: false,
                    macros: { "\\R":"\\mathbb{R}", "\\N":"\\mathbb{N}", "\\Z":"\\mathbb{Z}", "\\Q":"\\mathbb{Q}", "\\C":"\\mathbb{C}" }
                });
                html = html.replace(item.p, rendered);
            } catch(e) { html = html.replace(item.p, '<code>' + escapeHtml(item.math) + '</code>'); }
        });
        return html;
    }

    function renderMarkdown(content) {
        content = preprocessMath(content);
        var html = marked.parse(content);
        html = postprocessMath(html);
        return html;
    }

    // ==================== Decoding ====================
    function decodeNoteFromUrl() {
        var params = new URLSearchParams(window.location.search);
        var encoded = params.get('d');
        if (!encoded) return null;
        try {
            var base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4) base64 += '=';
            var decoded;
            if (typeof pako !== 'undefined') {
                try {
                    var bin = atob(base64);
                    var bytes = new Uint8Array(bin.length);
                    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                    decoded = new TextDecoder().decode(pako.inflate(bytes));
                } catch(e) { decoded = decodeURIComponent(escape(atob(base64))); }
            } else { decoded = decodeURIComponent(escape(atob(base64))); }
            var d = JSON.parse(decoded);
            return { title: d.t || d.title || 'Shared Note', content: d.c || d.content || '', sharedAt: d.d || new Date().toISOString() };
        } catch(e) { console.error('Decode error:', e); return null; }
    }

    function decompressNoteData(encoded) {
        try {
            var base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4) base64 += '=';
            var decoded;
            if (typeof pako !== 'undefined') {
                try {
                    var bin = atob(base64);
                    var bytes = new Uint8Array(bin.length);
                    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                    decoded = new TextDecoder().decode(pako.inflate(bytes));
                } catch(e) { decoded = decodeURIComponent(escape(atob(base64))); }
            } else { decoded = decodeURIComponent(escape(atob(base64))); }
            var d = JSON.parse(decoded);
            return { title: d.t || d.title || 'Shared Note', content: d.c || d.content || '', sharedAt: d.d || new Date().toISOString() };
        } catch(e) { console.error('Decompress error:', e); return null; }
    }

    var currentAlias = null;

    function getAliasFromUrl() {
        var params = new URLSearchParams(window.location.search);
        if (params.get('alias')) return params.get('alias');
        var segs = window.location.pathname.split('/').filter(function(s) { return s && s !== 'view.html'; });
        return segs.length > 0 ? segs[segs.length - 1] : null;
    }

    async function loadNoteByAlias(alias) {
        try {
            var r = await fetch('/api/note/' + alias);
            if (r.ok) { var j = await r.json(); if (j.success && j.data) { var n = decompressNoteData(j.data); if (n) { n.views = j.views; n.likes = j.likes || 0; return n; } } }
        } catch(e) { console.log('KV API unavailable, trying fallback...'); }
        try {
            var r2 = await fetch('/shared-notes.json');
            if (!r2.ok) throw new Error('Not found');
            var data = await r2.json();
            if (data.aliases && data.aliases[alias]) return decompressNoteData(data.aliases[alias]);
            if (data.notes) { for (var id in data.notes) { if (data.notes[id].alias === alias && data.notes[id].data) return decompressNoteData(data.notes[id].data); } }
        } catch(e) { console.error('Alias load error:', e); }
        return null;
    }

    // ==================== Display ====================
    function escapeHtml(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

    function showError(title, message) {
        document.getElementById('main-content').innerHTML =
            '<div class="error-container">' +
            '<div class="error-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent-danger)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>' +
            '<h2 class="error-title">' + title + '</h2>' +
            '<p class="error-message">' + message + '</p>' +
            '<a href="/" class="view-btn view-btn-primary">Create Your Own Note</a>' +
            '</div>';
    }

    async function displayNote(note) {
        var renderedContent = renderMarkdown(note.content);
        var words = note.content.trim().split(/\s+/).length;

        var metaHtml = '';
        if (note.sharedAt) metaHtml += '<span>Shared ' + new Date(note.sharedAt).toLocaleDateString() + '</span>';
        metaHtml += '<span>' + words.toLocaleString() + ' words</span>';
        metaHtml += '<span>' + Math.ceil(words / 200) + ' min read</span>';
        if (typeof note.views === 'number') metaHtml += '<span>' + note.views + ' views</span>';
        if (typeof note.likes === 'number') metaHtml += '<button class="view-like-btn" id="viewLikeBtn" onclick="likeCurrentNote()">Heart <span id="viewLikeCount">' + note.likes + '</span></button>';

        document.getElementById('main-content').innerHTML =
            '<div class="note-header">' +
            '<h1 class="note-title">' + escapeHtml(note.title) + '</h1>' +
            '<div class="note-meta">' + metaHtml + '</div>' +
            '</div>' +
            '<div class="note-content" id="note-content">' + renderedContent + '</div>';

        document.title = note.title + ' \u2014 Markdown Notes';
        document.getElementById('viewStatusText').textContent = note.title;

        // Highlight code
        document.querySelectorAll('#note-content pre code').forEach(function(b) { hljs.highlightElement(b); });

        // Task lists
        document.querySelectorAll('#note-content li').forEach(function(li) {
            var t = li.innerHTML;
            if (t.startsWith('[ ] ')) { li.innerHTML = '<input type="checkbox" disabled> ' + t.slice(4); li.classList.add('task-list-item'); }
            else if (t.startsWith('[x] ') || t.startsWith('[X] ')) { li.innerHTML = '<input type="checkbox" checked disabled> ' + t.slice(4); li.classList.add('task-list-item'); }
        });

        // Callouts
        var nc = document.getElementById('note-content');
        nc.innerHTML = nc.innerHTML
            .replace(/<p>:::\s*(warning|info|success|danger)\s*<\/p>/gi, '<div class="callout callout-$1">')
            .replace(/<p>:::<\/p>/g, '</div>');

        // Lazy-load diagrams and charts only if content has them
        await renderAllDiagrams();
        await renderAllCharts();

        // Decorate runnable code blocks with interactive editor + run button
        decorateRunnableBlocks(nc);
    }

    async function likeCurrentNote() {
        if (!currentAlias) return;
        var btn = document.getElementById('viewLikeBtn');
        if (btn) btn.disabled = true;
        try {
            var r = await fetch('/api/like/' + encodeURIComponent(currentAlias), { method: 'POST' });
            var data = await r.json();
            if (data.success) {
                var count = document.getElementById('viewLikeCount');
                if (count) count.textContent = data.likes;
            }
        } catch(e) {
            if (btn) btn.disabled = false;
        }
    }

    function openRawView() {
        if (!currentAlias) return;
        window.open('/raw/' + encodeURIComponent(currentAlias), '_blank');
    }

    // ==================== Diagram Rendering (lazy) ====================
    async function renderAllDiagrams() {
        var nc = document.getElementById('note-content');
        if (!nc) return;

        // Mermaid
        var mermaidBlocks = nc.querySelectorAll('pre code.language-mermaid, pre code.mermaid');
        if (mermaidBlocks.length > 0) {
            try {
                await ensureMermaid();
                for (var i = 0; i < mermaidBlocks.length; i++) {
                    var block = mermaidBlocks[i];
                    var code = block.textContent;
                    var pre = block.closest('pre');
                    if (!pre) continue;
                    try {
                        var id = 'mermaid-' + Date.now() + '-' + i;
                        var div = document.createElement('div');
                        div.className = 'mermaid-container';
                        var result = await mermaid.render(id, code);
                        div.innerHTML = result.svg;
                        pre.replaceWith(div);
                    } catch(err) {
                        var ed = document.createElement('div');
                        ed.className = 'diagram-error';
                        ed.textContent = 'Mermaid error: ' + err.message;
                        pre.insertAdjacentElement('afterend', ed);
                    }
                }
            } catch(e) { console.warn('Mermaid load failed:', e); }
        }

        // PlantUML
        var pumlBlocks = nc.querySelectorAll('pre code.language-plantuml, pre code.plantuml');
        if (pumlBlocks.length > 0) {
            try {
                await ensurePlantUML();
                pumlBlocks.forEach(function(block) {
                    var code = block.textContent;
                    var encoded = plantumlEncoder.encode(code);
                    var img = document.createElement('img');
                    img.src = 'https://www.plantuml.com/plantuml/svg/' + encoded;
                    img.alt = 'PlantUML Diagram';
                    img.className = 'diagram-image';
                    var div = document.createElement('div');
                    div.className = 'diagram-container';
                    div.appendChild(img);
                    block.parentElement.replaceWith(div);
                });
            } catch(e) { console.warn('PlantUML load failed:', e); }
        }

        // Graphviz
        var gvBlocks = nc.querySelectorAll('pre code.language-dot, pre code.language-graphviz, pre code.dot, pre code.graphviz');
        if (gvBlocks.length > 0) {
            try {
                await ensureViz();
                for (var g = 0; g < gvBlocks.length; g++) {
                    var gBlock = gvBlocks[g];
                    try {
                        var viz = new Viz();
                        var svg = await viz.renderSVGElement(gBlock.textContent);
                        var gDiv = document.createElement('div');
                        gDiv.className = 'diagram-container';
                        gDiv.appendChild(svg);
                        gBlock.parentElement.replaceWith(gDiv);
                    } catch(err) {
                        var ged = document.createElement('div');
                        ged.className = 'diagram-error';
                        ged.textContent = 'Graphviz error: ' + err.message;
                        gBlock.parentElement.insertAdjacentElement('afterend', ged);
                    }
                }
            } catch(e) { console.warn('Viz.js load failed:', e); }
        }

        // D2
        nc.querySelectorAll('pre code.language-d2, pre code.d2').forEach(function(block) {
            var code = block.textContent;
            var div = document.createElement('div');
            div.className = 'diagram-container d2-placeholder';
            div.innerHTML = '<div style="padding:1.5rem;text-align:center;">' +
                '<p style="color:var(--text-secondary)">D2 Diagram (requires server-side rendering)</p>' +
                '<pre style="text-align:left;max-height:200px;overflow:auto;margin:10px 0">' + escapeHtml(code) + '</pre>' +
                '<a href="https://play.d2lang.com/?script=' + encodeURIComponent(code) + '" target="_blank" style="color:var(--accent-primary)">Open in D2 Playground \u2192</a>' +
                '</div>';
            block.parentElement.replaceWith(div);
        });
    }

    // ==================== Chart Rendering (lazy) ====================
    async function renderAllCharts() {
        var nc = document.getElementById('note-content');
        if (!nc) return;

        // Chart.js
        var cjsBlocks = nc.querySelectorAll('pre code.language-chartjs, pre code.chartjs');
        if (cjsBlocks.length > 0) {
            try {
                await ensureChartJS();
                cjsBlocks.forEach(function(block, idx) {
                    try {
                        var config = JSON.parse(block.textContent);
                        var canvas = document.createElement('canvas');
                        canvas.id = 'chart-' + Date.now() + '-' + idx;
                        var div = document.createElement('div');
                        div.className = 'chart-container';
                        div.style.maxWidth = '600px';
                        div.style.margin = '1rem auto';
                        div.appendChild(canvas);
                        block.parentElement.replaceWith(div);
                        new Chart(canvas, config);
                    } catch(err) { console.error('Chart.js error:', err); }
                });
            } catch(e) { console.warn('Chart.js load failed:', e); }
        }

        // Plotly
        var plotlyBlocks = nc.querySelectorAll('pre code.language-plotly, pre code.plotly');
        if (plotlyBlocks.length > 0) {
            try {
                await ensurePlotly();
                plotlyBlocks.forEach(function(block, idx) {
                    try {
                        var config = JSON.parse(block.textContent);
                        var div = document.createElement('div');
                        div.id = 'plotly-' + Date.now() + '-' + idx;
                        div.className = 'chart-container';
                        block.parentElement.replaceWith(div);
                        Plotly.newPlot(div.id, config.data || [], config.layout || {}, config.config || {});
                    } catch(err) { console.error('Plotly error:', err); }
                });
            } catch(e) { console.warn('Plotly load failed:', e); }
        }

        // Vega / Vega-Lite
        var vegaBlocks = nc.querySelectorAll('pre code.language-vega-lite, pre code.language-vegalite, pre code.vega-lite, pre code.language-vega, pre code.vega');
        if (vegaBlocks.length > 0) {
            try {
                await ensureVega();
                vegaBlocks.forEach(function(block, idx) {
                    try {
                        var spec = JSON.parse(block.textContent);
                        var div = document.createElement('div');
                        div.id = 'vega-' + Date.now() + '-' + idx;
                        div.className = 'chart-container';
                        block.parentElement.replaceWith(div);
                        vegaEmbed('#' + div.id, spec, { theme: 'dark' });
                    } catch(err) { console.error('Vega error:', err); }
                });
            } catch(e) { console.warn('Vega load failed:', e); }
        }
    }

    // ==================== Interactive Code Runner ====================
    var RUNNABLE_LANGS = {
        javascript: { id: 63, label: 'JavaScript' },
        js:         { id: 63, label: 'JavaScript' },
        python:     { id: 71, label: 'Python' },
        py:         { id: 71, label: 'Python' },
        java:       { id: 62, label: 'Java' },
        c:          { id: 50, label: 'C' },
        cpp:        { id: 54, label: 'C++' },
        cxx:        { id: 54, label: 'C++' },
        go:         { id: 60, label: 'Go' },
        rust:       { id: 73, label: 'Rust' },
        rs:         { id: 73, label: 'Rust' },
        csharp:     { id: 51, label: 'C#' },
        cs:         { id: 51, label: 'C#' },
        bash:       { id: 46, label: 'Bash' },
        sh:         { id: 46, label: 'Bash' }
    };

    function getLangKey(codeEl) {
        var cls = Array.from(codeEl.classList).find(function(c) { return c.startsWith('language-'); });
        if (!cls) return null;
        return cls.replace('language-', '').toLowerCase();
    }

    function escHtml(t) {
        var d = document.createElement('div');
        d.textContent = t;
        return d.innerHTML;
    }

    function decorateRunnableBlocks(container) {
        if (!container) return;
        container.querySelectorAll('pre code').forEach(function(codeEl) {
            var key = getLangKey(codeEl);
            if (!key || !RUNNABLE_LANGS[key]) return;
            var lang = RUNNABLE_LANGS[key];
            var pre = codeEl.closest('pre');
            if (!pre || pre.dataset.runnerAttached) return;
            pre.dataset.runnerAttached = '1';

            var originalCode = codeEl.textContent || '';

            // Build wrapper
            var wrap = document.createElement('div');
            wrap.className = 'code-runner-wrap';

            // Header row
            var header = document.createElement('div');
            header.className = 'code-runner-header';
            header.innerHTML =
                '<span class="code-runner-lang">' + escHtml(lang.label) + '</span>' +
                '<button class="code-run-btn" type="button" id="runbtn-' + Date.now() + '-' + Math.random().toString(36).slice(2) + '">' +
                '<svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><polygon points="1,0 10,5 1,10"/></svg> Run</button>';

            // Editable code area
            var textarea = document.createElement('textarea');
            textarea.className = 'code-runner-editor';
            textarea.spellcheck = false;
            textarea.autocomplete = 'off';
            textarea.value = originalCode;
            // auto-resize
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 400) + 'px';
            });
            // Tab key inserts spaces
            textarea.addEventListener('keydown', function(e) {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    var s = this.selectionStart, en = this.selectionEnd;
                    this.value = this.value.substring(0, s) + '    ' + this.value.substring(en);
                    this.selectionStart = this.selectionEnd = s + 4;
                }
            });

            // Stdin row
            var stdinRow = document.createElement('div');
            stdinRow.className = 'code-runner-stdin-wrap';
            var stdinLabel = document.createElement('span');
            stdinLabel.className = 'code-runner-stdin-label';
            stdinLabel.textContent = 'stdin (optional):';
            var stdinInput = document.createElement('input');
            stdinInput.className = 'code-runner-stdin';
            stdinInput.type = 'text';
            stdinInput.placeholder = 'Input to pass to your program…';
            stdinRow.appendChild(stdinLabel);
            stdinRow.appendChild(stdinInput);

            // Output panel
            var outputPanel = document.createElement('div');
            outputPanel.className = 'code-run-output';
            outputPanel.style.display = 'none';

            // Assemble
            wrap.appendChild(header);
            wrap.appendChild(textarea);
            wrap.appendChild(stdinRow);
            wrap.appendChild(outputPanel);

            // Replace the original <pre> with our widget
            pre.replaceWith(wrap);

            // Auto-size textarea initially
            setTimeout(function() {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 400) + 'px';
            }, 0);

            // Wire run button
            var runBtn = header.querySelector('.code-run-btn');
            runBtn.addEventListener('click', function() {
                runCode(lang, textarea, stdinInput, outputPanel, runBtn);
            });
        });
    }

    async function runCode(lang, textarea, stdinInput, outputPanel, runBtn) {
        if (runBtn.dataset.running) return;
        runBtn.dataset.running = '1';
        runBtn.classList.add('running');
        runBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin-btn .7s linear infinite"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg> Running…';
        runBtn.disabled = true;

        outputPanel.style.display = 'block';
        outputPanel.className = 'code-run-output running';
        outputPanel.innerHTML =
            '<div class="code-run-output-header"><span>Running ' + escHtml(lang.label) + '…</span></div>' +
            '<pre>Submitting to Judge0…</pre>';

        try {
            var payload = {
                language: lang.label.toLowerCase().replace(/[^a-z]/g, ''),
                languageId: lang.id,
                sourceCode: textarea.value,
                stdin: stdinInput.value
            };

            var resp = await fetch('/api/run-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            var data = {};
            try { data = await resp.json(); } catch(e) {}

            if (!resp.ok || !data.success) {
                throw new Error(data.details || data.error || ('HTTP ' + resp.status));
            }

            var result = data.result || {};
            var statusId = result.status && result.status.id != null ? Number(result.status.id) : null;
            var statusText = (result.status && result.status.description) ? result.status.description : 'Done';

            var chunks = [];
            if (result.stdout) chunks.push(result.stdout);
            if (result.stderr) chunks.push('[stderr]\n' + result.stderr);
            if (result.compileOutput) chunks.push('[compile]\n' + result.compileOutput);
            if (result.message) chunks.push('[msg]\n' + result.message);
            var outputText = chunks.join('\n\n').trim() || '(no output)';

            var meta = [];
            if (result.time != null && result.time !== '') meta.push('<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-1px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ' + result.time + 's');
            if (result.memory != null && result.memory !== '') meta.push('<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-1px"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 6V4m4 2V4m4 2V4m4 2V4"/></svg> ' + result.memory + ' KB');

            var state = statusId === 3 ? 'success' : 'error';
            outputPanel.className = 'code-run-output ' + state;
            outputPanel.innerHTML =
                '<div class="code-run-output-header">' +
                '<span>' + escHtml('Result: ' + statusText) + '</span>' +
                (meta.length ? '<span class="code-run-meta">' + meta.join('<span style="opacity:.35"> · </span>') + '</span>' : '') +
                '</div>' +
                '<pre>' + escHtml(outputText) + '</pre>';

        } catch (err) {
            outputPanel.className = 'code-run-output error';
            outputPanel.innerHTML =
                '<div class="code-run-output-header"><span>Execution failed</span></div>' +
                '<pre>' + escHtml(err.message || 'Unknown error') + '</pre>';
        } finally {
            delete runBtn.dataset.running;
            runBtn.classList.remove('running');
            runBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><polygon points="1,0 10,5 1,10"/></svg> Run';
            runBtn.disabled = false;
        }
    }

    // ==================== Copy ====================
    var currentNote = null;
    function copyContent() {
        if (!currentNote) return;
        navigator.clipboard.writeText(currentNote.content).then(function() {
            var btn = document.querySelector('.view-btn-secondary');
            if (btn) {
                var orig = btn.innerHTML;
                btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
                setTimeout(function() { btn.innerHTML = orig; }, 2000);
            }
        }).catch(function() {
            var ta = document.createElement('textarea'); ta.value = currentNote.content; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        });
    }

    // ==================== Init ====================
    document.addEventListener('DOMContentLoaded', async function() {
        await new Promise(function(r) { setTimeout(r, 100); });
        var note = decodeNoteFromUrl();
        if (!note) {
            var alias = getAliasFromUrl();
            if (alias && alias !== 'view' && alias !== 'view.html') {
                currentAlias = alias;
                var rawBtn = document.getElementById('rawViewBtn');
                if (rawBtn) rawBtn.classList.remove('hidden');
                note = await loadNoteByAlias(alias);
            }
        }
        if (note) {
            currentNote = note;
            await displayNote(note);
        } else {
            var params = new URLSearchParams(window.location.search);
            if (params.has('d') || params.has('alias')) {
                showError('Note Not Found', 'The shared note could not be found or the link is invalid.');
            } else {
                window.location.href = '/';
            }
        }
    });
    </script>
